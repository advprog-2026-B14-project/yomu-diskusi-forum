apiVersion: apps/v1
kind: Deployment
metadata:
  name: yomu-deployment
  labels:
    app: yomu-forum
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yomu-forum
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: yomu-forum
    spec:
      containers:
        - name: yomu-container
          image: ghcr.io/<ORG>/yomu-forum:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
