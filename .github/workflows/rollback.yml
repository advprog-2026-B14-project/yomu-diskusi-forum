name: Manual Rollback to Previous Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image reference to rollback to (ghcr.io/...:tag)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Rollback to specified image
        run: |
          koyeb service update ${{ vars.KOYEB_APP_NAME }}/${{ vars.KOYEB_SERVICE_NAME }} \
            --docker ${{ github.event.inputs.image }}
