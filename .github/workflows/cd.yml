name: Continuous Deployment (Koyeb)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: koyeb-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Publish Image and Deploy to Koyeb
    runs-on: ubuntu-latest

    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP_NAME: ${{ vars.KOYEB_APP_NAME }}
      KOYEB_SERVICE_NAME: ${{ vars.KOYEB_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run project verification (tests, checkstyle, coverage)
        run: |
          chmod +x gradlew
          ./gradlew clean check

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yomu-forum:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/yomu-forum:latest

      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Deploy to Koyeb
        run: |
          koyeb service update ${{ vars.KOYEB_APP_NAME }}/${{ vars.KOYEB_SERVICE_NAME }} \
            --docker ghcr.io/${{ github.repository_owner }}/yomu-forum:${{ github.sha }}

