name: Continuous Deployment (Koyeb)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest

    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP_NAME: ${{ vars.KOYEB_APP_NAME }}
      KOYEB_SERVICE_NAME: ${{ vars.KOYEB_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy project directory to Koyeb
        run: |
          APP_NAME="${KOYEB_APP_NAME:-yomu-diskusi-forum}"
          SERVICE_NAME="${KOYEB_SERVICE_NAME:-yomu-diskusi-forum}"

          koyeb deploy . "${APP_NAME}/${SERVICE_NAME}" \
            --token "$KOYEB_API_TOKEN" \
            --archive-builder docker \
            --archive-docker-dockerfile Dockerfile \
            --env PORT=8080 \
            --ports 8080:http \
            --routes /:8080 \
            --checks 8080:tcp \
            --wait \
            --wait-timeout 20m
