name: Continuous Deployment (Zero Token Version)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR and Dockerfile to EC2
        uses: appleboy/scp-action@master
        with:
          host: 18.207.58.155
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,Dockerfile"
          target: "~/yomu-app"
          strip_components: 0

      - name: Build and Run Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: 18.207.58.155
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/yomu-app
            # Stop container lama
            sudo docker stop yomu-diskusi-forum || true
            sudo docker rm yomu-diskusi-forum || true

            # Build image baru secara lokal di EC2 (Nggak butuh ECR/Token)
            sudo docker build -t yomu-diskusi-forum:latest .

            # Jalankan dengan Env Var Database
            sudo docker run -d \
              --name yomu-diskusi-forum \
              -p 8085:8085 \
              -e SPRING_DATASOURCE_URL="${{ secrets.DB_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              yomu-diskusi-forum:latest
