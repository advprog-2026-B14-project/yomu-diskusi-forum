name: Continuous Deployment (Koyeb)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest

    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP_NAME: ${{ vars.KOYEB_APP_NAME }}
      KOYEB_SERVICE_NAME: ${{ vars.KOYEB_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Deploy to Koyeb (official action)
        # SECURITY: pin action to specific commit SHA to avoid supply-chain changes
        # Replace <FULL_COMMIT_SHA> with the full commit SHA from the koyeb/koyeb-action repository
        uses: koyeb/koyeb-action@<FULL_COMMIT_SHA>
        with:
          api-token: ${{ secrets.KOYEB_API_TOKEN }}
          app-name: ${{ vars.KOYEB_APP_NAME }}
          service-name: ${{ vars.KOYEB_SERVICE_NAME }}
          dockerfile: Dockerfile
          archive-builder: docker
          env: PORT=8080
          ports: 8080:http
          routes: "/:8080"
          checks: 8080:tcp
          wait: true
          wait-timeout: 20m
