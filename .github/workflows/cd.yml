name: Continuous Deployment (Koyeb)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: koyeb-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Publish Image and Deploy to Koyeb
    runs-on: ubuntu-latest

    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP_NAME: ${{ vars.KOYEB_APP_NAME }}
      KOYEB_SERVICE_NAME: ${{ vars.KOYEB_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Install Koyeb CLI
        id: install_koyeb
        uses: koyeb-community/koyeb-actions@969e180512fa08ddac5231e2f78c8fb025fd5db7 # v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run project verification (tests, checkstyle, coverage)
        run: |
          chmod +x gradlew
          ./gradlew clean check

      - name: Log in to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/yomu-forum:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/yomu-forum:latest

      - name: Deploy to Koyeb
        run: |
          koyeb service update ${{ vars.KOYEB_APP_NAME }}/${{ vars.KOYEB_SERVICE_NAME }} \
            --docker ghcr.io/${{ env.REPO_OWNER }}/yomu-forum:${{ github.sha }}

      - name: Wait for deployment to be healthy
        id: healthcheck
        run: |
          echo "Waiting for Koyeb deployment to finish and become healthy..."
          # Koyeb might take a minute or two to deploy. Poll the health endpoint for up to 3 minutes
          TIMEOUT=180
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://verbal-atalanta-moondiverc-c0bd26af.koyeb.app/actuator/health)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment is healthy!"
              exit 0
            fi
            echo "Status $STATUS... waiting"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Deployment failed health check."
          exit 1

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          echo "Healthcheck failed. Rolling back to previous commit..."
          PREV_SHA="${{ github.event.before }}"
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous SHA available for rollback. Please use the manual rollback workflow."
            exit 1
          fi
          koyeb service update ${{ vars.KOYEB_APP_NAME }}/${{ vars.KOYEB_SERVICE_NAME }} \
            --docker ghcr.io/${{ env.REPO_OWNER }}/yomu-forum:$PREV_SHA
          echo "Rollback to $PREV_SHA initiated."
