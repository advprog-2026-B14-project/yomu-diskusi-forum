spring.config.import=optional:file:.env[.properties]
spring.application.name=yomu-forum
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Settings
# 'validate' memastikan Entity Java cocok dengan tabel SQL tanpa mengubahnya
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JSON Formatting
spring.jackson.serialization.indent_output=true

# Comma separated list of allowed origins for CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}