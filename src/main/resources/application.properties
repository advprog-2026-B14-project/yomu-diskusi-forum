spring.config.import=optional:file:.env[.properties]
spring.application.name=yomu-forum
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
# Default to update so the app can start on an embedded fallback database.
# Set DDL_AUTO=validate in production if you want strict schema verification.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection pool: keep small for low-memory instances
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:2}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf
spring.thymeleaf.check-template-location=false

# JSON Formatting
spring.jackson.serialization.indent_output=true

# Comma separated list of allowed origins for CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}

# Actuator & Monitoring
# Expose health, info and prometheus metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

# Liveness probe: just checks the app is running (no DB check)
# Readiness probe: checks if the app can serve traffic (includes DB)
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db,ping